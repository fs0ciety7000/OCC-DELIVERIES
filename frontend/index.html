<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OCC Deliveries — commandes groupées</title>
    <meta name="description" content="Commandez à manger entre collègues : on vote pour le resto, chacun compose son panier, on rembourse en un scan." />
    <meta name="theme-color" content="#0A0A0D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAF8F4" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OCC" />
    <meta property="og:title" content="OCC Deliveries" />
    <meta property="og:description" content="Qu'est-ce qu'on mange ? Commandes groupées entre collègues." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      ;(function () {
        try {
          var pref = localStorage.getItem('occ-theme') || 'dark'
          var theme = pref === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : pref
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <noscript>OCC Deliveries a besoin de JavaScript pour fonctionner.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
